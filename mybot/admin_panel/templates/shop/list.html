{% extends "base.html" %}

{% block title %}Productos{% endblock %}
{% block page_title %}Tienda - Productos{% endblock %}

{% block content %}
<div x-data="productsList()" x-init="loadProducts()">
    
    <!-- Header con botón de crear -->
    <div class="sm:flex sm:items-center sm:justify-between mb-6">
        <div>
            <h2 class="text-xl font-semibold text-gray-900">Lista de Productos</h2>
            <p class="mt-1 text-sm text-gray-500">Gestiona los productos disponibles en la tienda</p>
        </div>
        <div class="mt-4 sm:mt-0">
            <a 
                href="{{ url_for('shop_products_new') }}" 
                class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Nuevo Producto
            </a>
        </div>
    </div>
    
    <!-- Filtros y búsqueda -->
    <div class="bg-white shadow rounded-lg p-4 mb-6">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-4">
            <!-- Búsqueda -->
            <div>
                <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Buscar</label>
                <input 
                    type="text" 
                    id="search"
                    x-model="filters.search"
                    @input.debounce.500ms="loadProducts()"
                    placeholder="Buscar productos..."
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm">
            </div>
            
            <!-- Categoría -->
            <div>
                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                <select 
                    id="category"
                    x-model="filters.category"
                    @change="loadProducts()"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm">
                    <option value="">Todas</option>
                    <option value="content">Contenido</option>
                    <option value="vip_upgrade">Upgrade VIP</option>
                    <option value="feature">Característica</option>
                </select>
            </div>
            
            <!-- Estado -->
            <div>
                <label for="is_active" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <select 
                    id="is_active"
                    x-model="filters.is_active"
                    @change="loadProducts()"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm">
                    <option value="">Todos</option>
                    <option value="true">Activos</option>
                    <option value="false">Inactivos</option>
                </select>
            </div>
            
            <!-- VIP Only -->
            <div>
                <label for="is_vip_only" class="block text-sm font-medium text-gray-700 mb-1">Acceso</label>
                <select 
                    id="is_vip_only"
                    x-model="filters.is_vip_only"
                    @change="loadProducts()"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm">
                    <option value="">Todos</option>
                    <option value="false">Público</option>
                    <option value="true">Solo VIP</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- Loading State -->
    <div x-show="loading" class="text-center py-12">
        <svg class="animate-spin h-10 w-10 text-primary-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="mt-2 text-sm text-gray-500">Cargando productos...</p>
    </div>
    
    <!-- Grid de Productos -->
    <div x-show="!loading" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <template x-if="products.length === 0">
            <div class="col-span-full text-center py-12 bg-white rounded-lg shadow">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                <p class="mt-2 text-gray-500">No se encontraron productos</p>
            </div>
        </template>
        
        <template x-for="product in products" :key="product.id">
            <div class="bg-white overflow-hidden shadow rounded-lg hover:shadow-lg transition-shadow">
                <div class="p-5">
                    <!-- Header con estado -->
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="text-lg font-medium text-gray-900" x-text="product.name"></h3>
                        <span 
                            :class="product.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium">
                            <span x-text="product.is_active ? 'Activo' : 'Inactivo'"></span>
                        </span>
                    </div>
                    
                    <!-- Descripción -->
                    <p class="text-sm text-gray-500 line-clamp-2 mb-4" x-text="product.description || 'Sin descripción'"></p>
                    
                    <!-- Info Grid -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <!-- Precio -->
                        <div class="bg-blue-50 rounded-lg p-3">
                            <p class="text-xs text-blue-600 font-medium">Precio</p>
                            <p class="text-lg font-bold text-blue-900">
                                <span x-text="product.price"></span>
                                <span class="text-sm font-normal">besitos</span>
                            </p>
                        </div>
                        
                        <!-- Categoría -->
                        <div class="bg-purple-50 rounded-lg p-3">
                            <p class="text-xs text-purple-600 font-medium">Categoría</p>
                            <p class="text-sm font-semibold text-purple-900 capitalize" x-text="product.category.replace('_', ' ')"></p>
                        </div>
                    </div>
                    
                    <!-- Badges -->
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span 
                            x-show="product.is_vip_only"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                            <svg class="h-3 w-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                            </svg>
                            VIP
                        </span>
                        
                        <span 
                            x-show="product.stock !== null"
                            :class="product.stock > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium">
                            Stock: <span x-text="product.stock"></span>
                        </span>
                        
                        <span 
                            x-show="product.files_count > 0"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">
                            <svg class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                            <span x-text="product.files_count"></span> archivos
                        </span>
                    </div>
                    
                    <!-- Acciones -->
                    <div class="flex gap-2">
                        <a 
                            :href="`{{ url_for('shop_products_edit', product_id=0) }}`.replace('0', product.id)"
                            class="flex-1 inline-flex justify-center items-center px-3 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                            Editar
                        </a>
                        <button 
                            @click="deleteProduct(product.id, product.name)"
                            class="flex-1 inline-flex justify-center items-center px-3 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                            Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
    
    <!-- Paginación -->
    <div x-show="totalPages > 1" class="mt-6 bg-white shadow rounded-lg px-4 py-3 flex items-center justify-between sm:px-6">
        <div class="flex-1 flex justify-between sm:hidden">
            <button 
                @click="previousPage()"
                :disabled="currentPage === 1"
                :class="{'opacity-50 cursor-not-allowed': currentPage === 1}"
                class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                Anterior
            </button>
            <button 
                @click="nextPage()"
                :disabled="currentPage === totalPages"
                :class="{'opacity-50 cursor-not-allowed': currentPage === totalPages}"
                class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                Siguiente
            </button>
        </div>
        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
            <div>
                <p class="text-sm text-gray-700">
                    Mostrando
                    <span class="font-medium" x-text="((currentPage - 1) * perPage) + 1"></span>
                    a
                    <span class="font-medium" x-text="Math.min(currentPage * perPage, totalItems)"></span>
                    de
                    <span class="font-medium" x-text="totalItems"></span>
                    resultados
                </p>
            </div>
            <div>
                <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                    <button 
                        @click="previousPage()"
                        :disabled="currentPage === 1"
                        :class="{'opacity-50 cursor-not-allowed': currentPage === 1}"
                        class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                        <span class="sr-only">Anterior</span>
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    
                    <template x-for="page in visiblePages" :key="page">
                        <button 
                            @click="goToPage(page)"
                            :class="page === currentPage ? 'bg-primary-50 border-primary-500 text-primary-600' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'"
                            class="relative inline-flex items-center px-4 py-2 border text-sm font-medium"
                            x-text="page">
                        </button>
                    </template>
                    
                    <button 
                        @click="nextPage()"
                        :disabled="currentPage === totalPages"
                        :class="{'opacity-50 cursor-not-allowed': currentPage === totalPages}"
                        class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                        <span class="sr-only">Siguiente</span>
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Alpine.js Component -->
<script>
    function productsList() {
        return {
            loading: false,
            products: [],
            currentPage: 1,
            perPage: 12,
            totalItems: 0,
            totalPages: 0,
            
            filters: {
                search: '',
                category: '',
                is_active: '',
                is_vip_only: ''
            },
            
            async loadProducts() {
                this.loading = true;
                
                try {
                    const params = new URLSearchParams({
                        page: this.currentPage,
                        per_page: this.perPage
                    });
                    
                    if (this.filters.search) params.append('search', this.filters.search);
                    if (this.filters.category) params.append('category', this.filters.category);
                    if (this.filters.is_active) params.append('is_active', this.filters.is_active);
                    if (this.filters.is_vip_only) params.append('is_vip_only', this.filters.is_vip_only);
                    
                    const response = await fetch(`/api/v1/shop/products?${params}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        this.products = data.data;
                        this.totalItems = data.pagination.total_items;
                        this.totalPages = data.pagination.total_pages;
                        this.currentPage = data.pagination.current_page;
                    }
                } catch (error) {
                    console.error('Error loading products:', error);
                } finally {
                    this.loading = false;
                }
            },
            
            async deleteProduct(id, name) {
                if (!confirm(`¿Estás seguro de eliminar el producto "${name}"?\n\nEsta acción no se puede deshacer.`)) {
                    return;
                }
                
                try {
                    const response = await fetch(`/api/v1/shop/products/${id}`, {
                        method: 'DELETE'
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        await this.loadProducts();
                    } else {
                        alert(`Error: ${data.error}`);
                    }
                } catch (error) {
                    console.error('Error deleting product:', error);
                    alert('Error al eliminar el producto');
                }
            },
            
            previousPage() {
                if (this.currentPage > 1) {
                    this.currentPage--;
                    this.loadProducts();
                }
            },
            
            nextPage() {
                if (this.currentPage < this.totalPages) {
                    this.currentPage++;
                    this.loadProducts();
                }
            },
            
            goToPage(page) {
                this.currentPage = page;
                this.loadProducts();
            },
            
            get visiblePages() {
                const pages = [];
                const maxVisible = 5;
                let start = Math.max(1, this.currentPage - Math.floor(maxVisible / 2));
                let end = Math.min(this.totalPages, start + maxVisible - 1);
                
                if (end - start < maxVisible - 1) {
                    start = Math.max(1, end - maxVisible + 1);
                }
                
                for (let i = start; i <= end; i++) {
                    pages.push(i);
                }
                
                return pages;
            }
        }
    }
</script>
{% endblock %}
