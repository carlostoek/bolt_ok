# A generic, single database configuration.
[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, will be prepended to sys.path if present.
# delimit with ; on Windows, : on Unix/Linux.
prepend_sys_path = .

# template for migration file names, available variables are
# current_date, rev, slug, and compare_rev
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library.
# Any required timezone name from the IANA database may be used.
# E.g. America/New_York
# timezone =

# title string for migration files
# revision_environment = false

# set to 'true' to allow alembic revision --autogenerate
# to generate alembic..op.add_column(), etc. types on
# columns that are part of aForeignKeyConstraint object.
# Defaults to 'false'
# render_as_batch = false

# set to 'true' to ensure that autogenerated cast expressions
# are rendered as sqlalchemy.cast() instead of postgresql.CAST().
# Defaults to 'false'
# render_sqlalchemy_cast = false

# truncate all migration file names to 40 characters
# truncate_slug_length = 40

# the output encoding used when writing migration files
# output_encoding = utf-8

sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/botdb

# ... etc.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S